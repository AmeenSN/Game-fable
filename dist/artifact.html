<style>/* Layout: full-bleed 3D map; control-room chrome floats on top (top bar, left tools, right panel, bottom-left inspector). */
:root {

.kpis, .grid2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
